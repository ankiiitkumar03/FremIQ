name: Verify FREMIQ

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify downloadable Local Agent package
        run: bun run agent:verify

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Smoke test Docker Compose deployment
        run: |
          set -eu
          printf 'FREMIQ_DB_PASSWORD=%s\nFREMIQ_SECRET=%s\nFREMIQ_PORT=4000\n' \
            "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env
          docker compose build app
          docker compose up -d
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4000/api/system/status > /dev/null; then
              echo "FREMIQ started, applied migrations, and served system status"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app db
          exit 1

      - name: Clean up Docker Compose smoke test
        if: always()
        run: if [ -f .env ]; then docker compose down --volumes --remove-orphans; fi
